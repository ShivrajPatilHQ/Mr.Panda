name: Build installers

# Builds each platform on its own real runner — a Windows installer built under
# Wine on a Mac is not something anyone has actually run. Trigger it by hand, or
# push a v* tag to attach the results to that release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifacts: dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifacts: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          # Never let electron-builder try to publish on its own — we attach
          # artifacts explicitly below so a bad build can't overwrite a release.
          EP_DRAFT: true
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpanda-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
